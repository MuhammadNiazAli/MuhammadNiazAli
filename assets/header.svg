<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Terminal: whoami - Muhammad Niaz Ali, full-stack web developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="0.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="0.9s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="0.7s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="1.0s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="0.7s" begin="4.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="1.0s" begin="4.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="0" y="0" width="0" height="350"><animate attributeName="width" from="0" to="1200" dur="0.3s" begin="6.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="win"><rect x="1" y="1" width="1198" height="348" rx="10"/></clipPath>
  </defs>

  <style>
    text { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 19px; }
    .p   { fill: #FFC107; }
    .cmd { fill: #E6EDF3; }
    .out { fill: #8B949E; }
    .hi  { fill: #E6EDF3; font-weight: 600; }
    .ok  { fill: #3FB950; }
    .bar { fill: #6E7681; font-size: 14px; }
  </style>

  <g clip-path="url(#win)">
    <rect width="1200" height="350" fill="#0B0E14"/>

    <rect width="1200" height="46" fill="#11151C"/>
    <circle cx="28" cy="23" r="5.5" fill="#3A414C"/>
    <circle cx="48" cy="23" r="5.5" fill="#3A414C"/>
    <circle cx="68" cy="23" r="5.5" fill="#3A414C"/>
    <text class="bar" x="600" y="28" text-anchor="middle">~/muhammad-niaz-ali — zsh</text>
    <rect y="46" width="1200" height="1" fill="#1C222B"/>

    <g clip-path="url(#l1)">
      <text x="44" y="96"><tspan class="p">$</tspan><tspan class="cmd" dx="12">whoami</tspan></text>
    </g>

    <g clip-path="url(#l2)">
      <text class="hi" x="44" y="126">muhammad niaz ali — full-stack web developer</text>
    </g>

    <g clip-path="url(#l3)">
      <text x="44" y="172"><tspan class="p">$</tspan><tspan class="cmd" dx="12">cat stack.txt</tspan></text>
    </g>

    <g clip-path="url(#l4)">
      <text class="out" x="44" y="202">typescript · react · next.js · node · postgres · supabase · react-native</text>
    </g>

    <g clip-path="url(#l5)">
      <text x="44" y="248"><tspan class="p">$</tspan><tspan class="cmd" dx="12">status --availability</tspan></text>
    </g>

    <g clip-path="url(#l6)">
      <text x="44" y="278"><tspan class="ok">✔</tspan><tspan class="out" dx="10">open to freelance work</tspan><tspan class="ok" dx="26">✔</tspan><tspan class="out" dx="10">pkt / utc+5</tspan><tspan class="ok" dx="26">✔</tspan><tspan class="out" dx="10">replies within 24h</tspan></text>
    </g>

    <g clip-path="url(#l7)">
      <text class="p" x="44" y="324">$</text>
    </g>
    <rect x="66" y="308" width="11" height="20" fill="#FFC107" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="6.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" begin="6.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="349" rx="10" fill="none" stroke="#222831" stroke-width="1"/>
